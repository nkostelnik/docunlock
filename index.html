    <noscript>
        <h1>docunlock</h1>
        <p>Removes editing restrictions from a .docx file so you can redline it freely. Counterparties often send Word documents with Track Changes forced on and the protection locked behind a password; docunlock strips that restriction and hands the document back, ready for markup. It works by opening the file as a ZIP archive in your browser, removing the &lt;w:documentProtection&gt; element from word/settings.xml, and repackaging it. Nothing is uploaded; the file never leaves your machine. This page requires JavaScript to run.</p>
